name: Build

# 只跑两件事：单元测试 + 出一个可安装的 debug 包。
# release 包需要 keystore，而 keystore 不该进版本库（也不该进 CI 的 secrets 之外的地方），
# 所以 CI 只出 debug 包 —— 它能装能跑，足够给别人试。
on:
  push:
    branches: [ master ]
  pull_request:
  # 手动触发：Actions 页面上点一下就能出包，不用等提交
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 compileSdk 与 build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # Windows 上提交的 gradlew 没有可执行位，Linux runner 直接跑会 Permission denied
      - name: 修正 gradlew 权限
        run: chmod +x gradlew

      # core 是纯 JVM，rules 依赖 android.util.Log 的桩，两者都能在无模拟器环境跑
      - name: 单元测试
        run: ./gradlew :core:testDebugUnitTest :rules:testDebugUnitTest --stacktrace

      - name: 构建 debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SplashSkip-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            rules/build/reports/tests/
          retention-days: 7
